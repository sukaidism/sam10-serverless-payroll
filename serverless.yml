service: calmaprg-serverless-payroll

provider:
  name: aws
  region: ap-southeast-2
  stage: dev
  runtime: provided.al2023
  deploymentBucket:
    name: calmaprg-payroll-sam10bucket
  environment:
    BUCKET_NAME: calmaprg-payroll-sam10bucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: arn:aws:s3:::calmaprg-payroll-sam10bucket/payslips/*

plugins:
  - ./vendor/bref/bref

functions:
  web:
    handler: index.php
    runtime: php-83-fpm
    timeout: 28
    memorySize: 1024
    events:
      - httpApi: '*'

package:
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!.git/**'